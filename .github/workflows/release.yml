name: Release

# Manually triggered publish to npm using OIDC "trusted publishing" — no
# long-lived npm token (NPM_TOKEN) is used or stored. Authentication is
# handled by a short-lived, per-run OIDC token that npm verifies against
# the "Trusted Publisher" configured on npmjs.com.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Exact version to publish (e.g. 0.4.0). Leave blank to apply the
          semver bump selected below.
        required: false
        default: ""
      bump:
        description: Semver bump to apply (ignored when an exact version is given).
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# contents: write      -> push the release branch/tag, open the GitHub release
# pull-requests: write -> open and merge the version-bump PR (see below)
# id-token:  write     -> required for npm OIDC trusted publishing + provenance.
permissions:
  contents: write
  pull-requests: write
  id-token: write

# Releases mutate the repo (PR + tag) and the npm registry, so never run two
# at once and never cancel one mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only release from the default branch — keeps tags and the npm registry
    # aligned with what's on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # registry-url tells npm which registry to publish to; the actual
      # authentication is the OIDC exchange (id-token: write above) checked
      # against the npm trusted-publisher config. No NPM_TOKEN is needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          # npm trusted-publishing guidance: never cache in release builds.
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install pandoc (pinned for Markdown lint/format)
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i pandoc-3.11-1-amd64.deb
          pandoc --version | head -1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the laya engine venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/laya-venv
          key: laya-venv-${{ runner.os }}-v1
          restore-keys: laya-venv-${{ runner.os }}-

      - name: Restore the laya checkpoints
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: laya-checkpoints-${{ runner.os }}-v1
          restore-keys: laya-checkpoints-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up the laya engine
        shell: bash
        run: |
          venv=node_modules/.cache/laya-venv
          if [ ! -f "$venv/bin/python" ] && [ ! -f "$venv/Scripts/python.exe" ]; then
            uv venv "$venv"
          fi
          uv pip install --python "$venv" laya --torch-backend=cpu
          if [ -f "$venv/bin/python" ]; then
            "$venv/bin/python" -c "import laya"
          else
            "$venv/Scripts/python.exe" -c "import laya"
          fi

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Bump version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_INPUT" ]; then
            if ! printf '%s' "$VERSION_INPUT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "::error::'$VERSION_INPUT' is not a valid semver version"
              exit 1
            fi
            npm version "$VERSION_INPUT" --no-git-tag-version
          else
            npm version "$BUMP" --no-git-tag-version >/dev/null
          fi
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # Publish via the npm CLI — it performs the OIDC token exchange against
      # the configured trusted publisher. pnpm drives everything else; npm
      # publish is the documented command for OIDC trusted publishing.
      # Provenance (build attestation) is generated automatically.
      # prepublishOnly re-runs lint, tests, and the dist build, so the
      # tarball's compiled output comes from exactly the code that passed the
      # gate above.
      # Skip publish when the version is already on npm, so a run that
      # published but failed at a later step can be re-run to finish the
      # tag/release bookkeeping instead of failing with EPUBLISHCONFLICT.
      - name: Publish to npm
        id: publish
        run: |
          set -o pipefail
          if npm view "system-one-adapter@${NEW_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::system-one-adapter@${NEW_VERSION} is already on npm; skipping publish"
          else
            npm publish --provenance 2>&1 | tee /tmp/publish.log
          fi

      # Both failure modes are cryptic in raw logs: the registry masks a
      # rejected trusted-publisher exchange as a bare E404, and a
      # provenance/repository mismatch surfaces as E422.
      - name: Diagnose publish failure
        if: failure() && steps.publish.outcome == 'failed'
        run: |
          if grep -q 'E404' /tmp/publish.log; then
            echo "::error title=E404 on PUT::The registry rejected the OIDC trusted-publisher exchange. Fix on npmjs.com -> system-one-adapter -> Settings -> Trusted publishing: repository owner 'SynthLuvr', repository 'system-one-adapter-js', workflow filename 'release.yml', environment left empty, allowed action 'npm publish'. Docs: https://docs.npmjs.com/trusted-publishers"
          elif grep -q 'E422' /tmp/publish.log; then
            echo "::error title=E422 provenance mismatch::The registry could not verify the provenance bundle. With --provenance, package.json's repository.url must match the provenance repository: https://github.com/SynthLuvr/system-one-adapter-js. Keep that field in sync with the repo."
          fi

      # Every commit on main so far is a squash-merged PR, so the version
      # bump goes through a short-lived PR too. With no required approvals
      # the workflow merges its own PR immediately; branches and tags can be
      # pushed directly.
      #
      # Requires the repo setting "Allow GitHub Actions to create and approve
      # pull requests" (Settings -> Actions -> General -> Workflow
      # permissions); without it gh pr create fails with "GitHub Actions is
      # not permitted to create or approve pull requests" even though the
      # token has pull-requests: write.
      #
      # Re-runnable: a partially-failed earlier attempt may have left the
      # release branch and/or its PR behind. The workflow owns release/*
      # branches, so an unconditional force push supersedes the stale copy,
      # and an already-open PR is reused instead of recreated.
      - name: Open and merge version-bump PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/v${NEW_VERSION}"
          # checkout detaches HEAD; carry the bump onto a release branch.
          git checkout -B "$branch"
          git add package.json
          git commit -m "chore(release): v${NEW_VERSION}"
          git push --force origin "$branch"
          pr_url="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base main --head "$branch" \
              --title "chore(release): v${NEW_VERSION}" \
              --body "Automated version bump for the v${NEW_VERSION} release (system-one-adapter@${NEW_VERSION} is on npm).")"
          fi
          if [ "$(gh pr view "$pr_url" --json state --jq .state)" = "OPEN" ]; then
            gh pr merge "$pr_url" --squash --delete-branch
          fi
          merge_sha="$(gh pr view "$pr_url" --json mergeCommit --jq .mergeCommit.oid)"
          echo "MERGE_SHA=${merge_sha}" >> "$GITHUB_ENV"

      # Only tag and release once npm has accepted the package, so a failed
      # publish never leaves an orphan tag or release.
      #
      # MERGE_SHA is born on the server via the squash merge and is NOT in
      # this depth-1 clone — fetch it before tagging. Tolerate an existing
      # tag/release so a re-run that only failed here can finish.
      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          main_sha="$(git rev-parse origin/main)"
          if [ "$main_sha" != "$MERGE_SHA" ]; then
            echo "::error::origin/main (${main_sha}) is no longer the release merge (${MERGE_SHA}); refusing to tag the wrong commit"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "::notice::tag v${NEW_VERSION} already exists; skipping tag push"
          else
            git tag "v${NEW_VERSION}" "${MERGE_SHA}"
            git push origin "v${NEW_VERSION}"
          fi
          if gh release view "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "::notice::release v${NEW_VERSION} already exists; skipping"
          else
            gh release create "v${NEW_VERSION}" \
              --title "v${NEW_VERSION}" \
              --notes "Published system-one-adapter@${NEW_VERSION} to npm: https://www.npmjs.com/package/system-one-adapter/v/${NEW_VERSION}"
          fi
