name: CI

on:
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install pandoc on Linux (pinned for Markdown lint/format)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i pandoc-3.11-1-amd64.deb
          pandoc --version | head -1

      - name: Install pandoc on Windows (pinned for Markdown lint/format)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\pandoc.zip"
          $dir = "$env:RUNNER_TEMP\pandoc-3.11"
          Invoke-WebRequest -Uri https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP"
          Add-Content $env:GITHUB_PATH $dir
          & "$dir\pandoc.exe" --version | Select-Object -First 1

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
